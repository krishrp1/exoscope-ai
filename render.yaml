services:
  - type: web
    name: exoscope-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONPATH
        value: "."
      - key: EXOSCOPE_CORS_ORIGINS
        value: "*"
      - key: EXOSCOPE_MAX_UPLOAD_MB
        value: "10"
      - key: EXOSCOPE_LOG_LEVEL
        value: "INFO"
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 2